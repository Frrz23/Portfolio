  <text x="400" y="160" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-weight="bold" font-size="38" fill="#5b8a76">Auction Schedule</text>
  <text x="400" y="196" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="19" fill="#8aa89d">Stay informed about bidding events</text>
  <rect x="90" y="240" width="290" height="120" rx="14" fill="#8fd1b3"/>
  <text x="235" y="278" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="21" fill="#ffffff">Current Week</text>
  <g font-family="Verdana, Arial, sans-serif" font-size="17" fill="#2f5447">
