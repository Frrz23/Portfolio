<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7bc8a4"/>
      <stop offset="100%" stop-color="#8fd1b3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="21" fill="#f4f7f6"/>
  <rect width="800" height="72" rx="21" fill="url(#top)"/>
  <rect y="51" width="800" height="21" fill="url(#top)"/>
  <rect x="26" y="22" width="40" height="28" rx="5" fill="#ffffff"/>
